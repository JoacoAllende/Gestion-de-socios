<div class="cell">
  <span *ngIf="params.value === null || params.value === undefined">❌</span>
  <span *ngIf="params.value > 0 && !allowUnmark">{{ params.value }}</span>

  <ng-container *ngIf="params.value > 0 && allowUnmark">
    <span [class.unmarked]="isUnmarked()">{{ params.value }}</span>
    <input type="checkbox" title="Desmarcar pago"
           [checked]="!isUnmarked()"
           (change)="toggleUnmark($event)" />
  </ng-container>
  <span *ngIf="params.value < 0">0</span>

  <ng-container *ngIf="params.value === 0 && mode === 'dual'">
    <input type="checkbox"
           [checked]="isSelected('yes')"
           (change)="toggleSelection($event, 'yes')" />
    <input type="checkbox"
           [checked]="isSelected('no')"
           (change)="toggleSelection($event, 'no')" />
  </ng-container>

  <ng-container *ngIf="params.value === 0 && mode === 'single'">
    <input type="checkbox"
           [checked]="isSelected('yes')"
           (change)="toggleSingleSelection($event)" />
  </ng-container>
</div>
