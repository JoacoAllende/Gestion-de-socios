<div class="buttons-wrapper">
  <h2 class="title">Publicidades - {{ titulo }}</h2>
  <app-month-selector [anio]="anio" [showMonth]="false" (change)="onYearChange($event)">
  </app-month-selector>
  <app-button [disabled]="!haySeleccion()" [text]="'Cargar publicidad'" [onClick]="procesarCobros">
  </app-button>
  <app-button [text]="'Nueva publicidad'" [onClick]="createSponsor">
  </app-button>
  <app-button [text]="modoDesmarcar ? 'Ocultar desmarcar' : 'Desmarcar cobros'" [onClick]="toggleModoDesmarcar">
  </app-button>
  <app-button [text]="'Exportar CSV'" [onClick]="exportCsv">
  </app-button>
</div>
<app-ag-table [rowData]="rowData" [colDefs]="colDefs" [defaultColDef]="defaultColDef" [gridStyle]="gridStyle"
  [pinnedBottomRowData]="pinnedBottomRowData" (gridReadyEvent)="onGridReady($event)">
</app-ag-table>
